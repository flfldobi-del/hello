<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forstenried → Riva del Garda · Rennrad-Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --panel2: #243044;
    --text: #e8eef7;
    --muted: #9aabbf;
    --accent: #3ecf8e;
    --accent2: #5b9fd4;
    --warn: #f0b429;
    --line: #2c3b52;
    --danger: #e85d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "side map"
      "profile profile";
    height: 100vh;
    min-height: 640px;
  }
  header {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #162033, var(--bg));
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }
  header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: flex-end; }
  .badge {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.35rem 0.7rem; font-size: 0.78rem; color: var(--text);
  }
  .badge strong { color: var(--accent); font-weight: 700; }
  aside {
    grid-area: side; overflow: auto; border-right: 1px solid var(--line);
    background: var(--panel); padding: 1rem;
  }
  #map { grid-area: map; min-height: 280px; }
  .profile-wrap {
    grid-area: profile; border-top: 1px solid var(--line);
    background: var(--panel); padding: 0.75rem 1rem 1rem;
  }
  h2 { margin: 0 0 0.6rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem;
  }
  .stat {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.65rem 0.75rem;
  }
  .stat .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .value { font-size: 1.15rem; font-weight: 700; margin-top: 0.15rem; }
  .stat .value span { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
  .section {
    border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 0.8rem;
    margin-bottom: 0.55rem; background: var(--panel2); cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .section:hover, .section.active { border-color: var(--accent2); }
  .section .t { font-weight: 650; font-size: 0.9rem; }
  .section .n { color: var(--muted); font-size: 0.78rem; margin-top: 0.2rem; }
  .section .m { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.45rem; font-size: 0.75rem; color: var(--muted); }
  .section .m b { color: var(--text); }
  .pos-card {
    background: linear-gradient(135deg, #1d3a34, var(--panel2));
    border: 1px solid #2f6b5a; border-radius: 12px; padding: 0.85rem;
    margin-bottom: 1rem;
  }
  .pos-card .km { font-size: 1.6rem; font-weight: 750; color: var(--accent); }
  .pos-card .sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.2rem; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.55rem; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.8rem;
  }
  .btn:hover { border-color: var(--accent); }
  .chart-box { height: 160px; position: relative; }
  .hint { color: var(--muted); font-size: 0.72rem; margin-top: 0.4rem; }
  .wpt-list { max-height: 220px; overflow: auto; margin-top: 0.4rem; }
  .wpt {
    display: grid; grid-template-columns: 54px 1fr auto; gap: 0.4rem;
    padding: 0.35rem 0.2rem; border-bottom: 1px solid var(--line);
    font-size: 0.8rem; cursor: pointer;
  }
  .wpt:hover { color: var(--accent); }
  .wpt .k { color: var(--accent2); font-variant-numeric: tabular-nums; }
  .wpt .e { color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 45vh auto minmax(40vh, auto);
      grid-template-areas: "header" "map" "profile" "side";
      height: auto; min-height: 100dvh;
    }
    header { flex-direction: column; align-items: flex-start; }
    .badges { justify-content: flex-start; }
    aside { max-height: none; border-right: none; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
    .chart-box { height: 150px; }
    .controls { position: sticky; top: 0; z-index: 5; background: var(--panel); padding: 0.25rem 0; }
    input[type=range] { height: 28px; }
  }
  .mobile-banner {
    display: none; background: #1d3a34; border-bottom: 1px solid #2f6b5a;
    padding: 0.55rem 1rem; font-size: 0.8rem; color: var(--text);
  }
  @media (max-width: 900px) { .mobile-banner { display: block; } }
</style>
</head>
<body>
<div class="mobile-banner">Handy: Regler unten ziehen · Karte zoomen mit zwei Fingern · Etappen antippen</div>
<div class="app">
  <header>
    <div>
      <h1 id="title">Route</h1>
      <p id="subtitle"></p>
    </div>
    <div class="badges" id="badges"></div>
  </header>

  <aside>
    <div class="pos-card">
      <div class="km"><span id="posKm">0.0</span> <span style="font-size:0.9rem;color:var(--muted)">km</span></div>
      <div class="sub">Höhe <strong id="posElev">–</strong> m · nächster Punkt: <span id="posNear">Start</span></div>
    </div>

    <h2>Übersicht</h2>
    <div class="stats" id="stats"></div>

    <h2>Etappen</h2>
    <div id="sections"></div>

    <h2>Wegpunkte</h2>
    <div class="wpt-list" id="wpts"></div>
  </aside>

  <div id="map"></div>

  <div class="profile-wrap">
    <div class="controls">
      <button class="btn" id="btnStart" title="Zum Start">⟲ Start</button>
      <input type="range" id="slider" min="0" max="1000" value="0" />
      <button class="btn" id="btnEnd" title="Zum Ziel">Ziel ⟳</button>
    </div>
    <div class="chart-box"><canvas id="elevChart"></canvas></div>
    <div class="hint">Ziehe den Regler oder klicke ins Höhenprofil / auf die Karte-Linie. Position, Marker und Profil bleiben synchron.</div>
  </div>
</div>

const sectionsEl = document.getElementById('sections');
DATA.sections.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'section';
  el.innerHTML = `<div class="t">${i+1}. ${s.title}</div>
    <div class="n">${s.note}</div>
    <div class="m"><span><b>${s.dist}</b> km</span><span>↑ <b>${s.asc}</b> m</span><span>↓ <b>${s.desc}</b> m</span><span>${s.from_km}→${s.to_km} km</span></div>`;
  el.onclick = () => {
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    jumpToKm(s.from_km);
  };
  sectionsEl.appendChild(el);
});

DATA.waypoints.forEach(w => {
  const el = document.createElement('div');
  el.className = 'wpt';
  el.innerHTML = `<span class="k">${w.km.toFixed(1)}</span><span>${w.name}</span><span class="e">${w.elev} m</span>`;
  el.onclick = () => jumpToKm(w.km);
  wptsEl.appendChild(el);
});

// Map
const map = L.map('map', { zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const latlngs = DATA.lat.map((lat, i) => [lat, DATA.lon[i]]);
const routeLine = L.polyline(latlngs, { color: '#3ecf8e', weight: 4, opacity: 0.9 }).addTo(map);
map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

DATA.waypoints.forEach((w, i) => {
  const isEnd = i === 0 || i === DATA.waypoints.length - 1;
  L.circleMarker([w.lat, w.lon], {
    radius: isEnd ? 7 : 4,
    color: isEnd ? '#f0b429' : '#5b9fd4',
    fillColor: isEnd ? '#f0b429' : '#5b9fd4',
    fillOpacity: 0.9,
    weight: 2
  }).bindTooltip(`${w.km} km · ${w.name}`, { direction: 'top' }).addTo(map);
});

  className: '',
  html: `<div style="width:16px;height:16px;border-radius:50%;background:#3ecf8e;border:3px solid #fff;box-shadow:0 0 0 2px #1a2332,0 2px 8px rgba(0,0,0,.45)"></div>`,
  iconSize: [16,16], iconAnchor: [8,8]
});
let rider = L.marker(latlngs[0], { icon: riderIcon, zIndexOffset: 1000 }).addTo(map);

// Chart
const ctx = document.getElementById('elevChart');
const n = DATA.dist_km.length;
const labels = DATA.dist_km;
const elevChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels,
    datasets: [{
      label: 'Höhe (m)',
      data: DATA.elev_m,
      borderColor: '#5b9fd4',
      backgroundColor: 'rgba(91,159,212,0.18)',
      fill: true,
      pointRadius: 0,
      borderWidth: 2,
      tension: 0.15
    },{
      label: 'Position',
      data: DATA.elev_m.map((e,i) => i===0 ? e : null),
      borderColor: '#3ecf8e',
      backgroundColor: '#3ecf8e',
      pointRadius: DATA.elev_m.map((_,i) => i===0 ? 5 : 0),
      pointHoverRadius: 6,
      showLine: false
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          title: (items) => items[0] ? `${Number(items[0].parsed.x ? labels[items[0].dataIndex] : labels[items[0].dataIndex]).toFixed(1)} km` : '',
          label: (item) => item.datasetIndex === 0 ? `Höhe: ${Math.round(item.parsed.y)} m` : null
        }
      }
    },
    scales: {
      x: {
        ticks: {
          color: '#9aabbf', maxTicksLimit: 10,
          callback: (val, i) => {
            const km = labels[i];
            return (i % Math.ceil(n/8) === 0) ? Math.round(km) : '';
          }
        },
        grid: { color: 'rgba(44,59,82,0.6)' }
      },
      y: {
        ticks: { color: '#9aabbf' },
        grid: { color: 'rgba(44,59,82,0.6)' },
        title: { display: true, text: 'm ü. NHN', color: '#9aabbf' }
      }
    },
    onClick: (evt, elems) => {
      const points = elevChart.getElementsAtEventForMode(evt, 'index', { intersect: false }, true);
      if (points[0]) setIndex(points[0].index);
    }
  }
});

function nearestWaypoint(km) {
  let best = DATA.waypoints[0], bd = 1e9;
  for (const w of DATA.waypoints) {
    const d = Math.abs(w.km - km);
    if (d < bd) { bd = d; best = w; }
  }
  return best;
}

function indexForKm(km) {
  let lo = 0, hi = DATA.dist_km.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (DATA.dist_km[mid] < km) lo = mid + 1;
    else hi = mid;
  }
  if (lo > 0 && Math.abs(DATA.dist_km[lo-1]-km) < Math.abs(DATA.dist_km[lo]-km)) return lo-1;
  return lo;
}

function setIndex(i) {
  i = Math.max(0, Math.min(DATA.dist_km.length - 1, i));
  const km = DATA.dist_km[i];
  const elev = DATA.elev_m[i];
  const near = nearestWaypoint(km);
  document.getElementById('posKm').textContent = km.toFixed(1);
  document.getElementById('posElev').textContent = Math.round(elev);
  document.getElementById('posNear').textContent = near.name;
  document.getElementById('slider').value = Math.round((i / (DATA.dist_km.length - 1)) * 1000);
  rider.setLatLng(latlngs[i]);
  // update position point on chart
  elevChart.data.datasets[1].data = DATA.elev_m.map((e, idx) => idx === i ? e : null);
  elevChart.data.datasets[1].pointRadius = DATA.elev_m.map((_, idx) => idx === i ? 5 : 0);
  elevChart.update('none');
}

function jumpToKm(km) { setIndex(indexForKm(km)); }

document.getElementById('slider').addEventListener('input', (e) => {
  const t = Number(e.target.value) / 1000;
  setIndex(Math.round(t * (DATA.dist_km.length - 1)));
});
document.getElementById('btnStart').onclick = () => setIndex(0);
document.getElementById('btnEnd').onclick = () => setIndex(DATA.dist_km.length - 1);

routeLine.on('click', (e) => {
  // find nearest track index to click
  let best = 0, bd = 1e18;
  const { lat, lng } = e.latlng;
  for (let i = 0; i < latlngs.length; i++) {
    const dlat = latlngs[i][0] - lat;
    const dlng = latlngs[i][1] - lng;
    const d = dlat*dlat + dlng*dlng;
    if (d < bd) { bd = d; best = i; }
  }
  setIndex(best);
});

setIndex(0);
</script>
